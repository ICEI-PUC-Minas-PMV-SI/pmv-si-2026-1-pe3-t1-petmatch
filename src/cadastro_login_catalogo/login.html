<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Entre na sua conta PetMatch e gerencie suas adoções e favoritos."/>
  <title>Entrar — PetMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orelega+One&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body class="auth-body">

  <!-- Decoração lateral -->
  <div class="auth-side" aria-hidden="true">
    <img src="imagemdefundo.jpg" alt="" />
    <div class="auth-side-overlay"></div>
    <div class="auth-side-content">
      <h2>Bem-vindo de volta!</h2>
      <p>Sua família perfeita pode estar esperando hoje.</p>
    </div>
  </div>

  <!-- Formulário -->
  <div class="auth-main">
    <div class="auth-card fade-in">
      <a href="../home/home.html" class="auth-logo">
        <img src="LOGO 4.png" alt="PetMatch" />
      </a>

      <h1>Entrar na conta</h1>
      <p class="auth-subtitle">Não tem conta? <a href="cadastro.html">Cadastre-se grátis →</a></p>

      <form id="loginForm" novalidate>

        <div class="form-field mt-16" id="field-email">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email"
                 placeholder="seu@email.com" autocomplete="email" required />
          <span class="field-error" id="err-email" hidden>E-mail inválido.</span>
        </div>

        <div class="form-field mt-16" id="field-senha">
          <label for="senha">Senha</label>
          <div class="input-pw">
            <input type="password" id="senha" name="senha"
                   placeholder="Sua senha" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" aria-label="Mostrar senha" tabindex="-1"
                    onclick="togglePw('senha', this)">👁️</button>
          </div>
          <span class="field-error" id="err-senha" hidden>Senha obrigatória.</span>
        </div>

        <div class="auth-links">
          <a href="comfirmemail.html">Esqueci minha senha</a>
          <a href="../home/home.html">Voltar para home</a>
        </div>

        <button type="submit" class="btn-primary w-full auth-submit">Entrar</button>

      </form>

      <div class="auth-divider"><span>ou</span></div>
      <a href="catalogo.html" class="btn-outline w-full" style="justify-content:center;margin-top:4px;">
        Explorar sem entrar →
      </a>
    </div>
  </div>

  <script src="../toast.js"></script>
  <script src="scripit.js"></script>
  <script src="../active-menu.js"></script>
  <script>
    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      const isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      btn.textContent = isText ? '👁️' : '🙈';
      btn.setAttribute('aria-label', isText ? 'Mostrar senha' : 'Ocultar senha');
    }
  </script>

</body>
</html>
